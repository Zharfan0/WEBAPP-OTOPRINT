<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Dokumen - OtoPrint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6d9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .verification-card {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        .status-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .status-valid   { background: #e8f5e9; color: #006A42; }
        .status-invalid { background: #ffebee; color: #dc3545; }
        .status-icon i  { font-size: 40px; }
        .status-text    { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .status-valid-text   { color: #006A42; }
        .status-invalid-text { color: #dc3545; }
        .info-table {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 16px;
            text-align: left;
            margin: 20px 0 0 0;
        }
        .info-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label {
            width: 130px;
            flex-shrink: 0;
            font-weight: 600;
            color: #555;
        }
        .info-value { flex: 1; color: #333; word-break: break-all; }
        .badge-verified {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e8f5e9;
            color: #006A42;
            border: 1px solid #a5d6a7;
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .btn-home {
            background: #006A42;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }
        .btn-home:hover { background: #005235; color: white; }
    </style>
</head>
<body>
<div class="verification-card" id="verificationCard">
    <div id="loadingState" style="padding: 40px; text-align: center;">
        <div class="spinner-border text-success" role="status"></div>
        <p class="mt-3" style="color:#555;">Memverifikasi dokumen...</p>
    </div>
    <div id="resultState" style="display: none;"></div>
</div>

<script>
async function verify() {
    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get('doc');
    const sigId = urlParams.get('sig'); // opsional

    if (!docId) {
        showInvalid('Link QR tidak valid atau tidak lengkap.');
        return;
    }

    try {
        const url = sigId
            ? `/api/verify-signature?doc=${encodeURIComponent(docId)}&sig=${encodeURIComponent(sigId)}`
            : `/api/verify-signature?doc=${encodeURIComponent(docId)}`;

        const res = await fetch(url);
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const data = await res.json();

        if (data.valid) {
            showValid(data);
        } else {
            showInvalid(data.message || 'Dokumen tidak dapat diverifikasi.');
        }
    } catch(err) {
        showInvalid('Gagal terhubung ke server. Pastikan perangkat terhubung ke jaringan yang sama.');
    }
}

function showValid(data) {
    document.getElementById('loadingState').style.display = 'none';
    const resultDiv = document.getElementById('resultState');

    // Baris info dosen — hanya tampil jika ada data signature
    const dosenRows = data.signature ? `
        <div style="font-size: 12px; font-weight: 700; color: #888; letter-spacing: 0.5px; margin: 16px 0 4px 0; text-align: left;">
            INFORMASI PENANDATANGAN
        </div>
        <div class="info-table">
            <div class="info-row">
                <div class="info-label">Nama Dosen</div>
                <div class="info-value">${escapeHtml(data.signature.nama_dosen || '-')}</div>
            </div>
            <div class="info-row">
                <div class="info-label">NIP</div>
                <div class="info-value">${escapeHtml(data.signature.nip || '-')}</div>
            </div>
            <div class="info-row">
                <div class="info-label">Jabatan</div>
                <div class="info-value">${escapeHtml(data.signature.jabatan || '-')}</div>
            </div>
        </div>` : '';

    // Format tanggal
    let printedAt = '-';
    if (data.printed_at) {
        try {
            const d = new Date(data.printed_at);
            const months = ['Januari','Februari','Maret','April','Mei','Juni',
                            'Juli','Agustus','September','Oktober','November','Desember'];
            printedAt = `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        } catch(e) { printedAt = data.printed_at; }
    }

    resultDiv.innerHTML = `
        <div class="status-icon status-valid">
            <i class="bi bi-shield-check"></i>
        </div>
        <div class="status-text status-valid-text">DOKUMEN ASLI</div>
        <div class="badge-verified">
            <i class="bi bi-check-circle-fill"></i> Terverifikasi oleh OtoPrint
        </div>
        <p style="color:#666; font-size:14px; margin-bottom:0;">
            Dokumen ini sah dan terdaftar dalam sistem OtoPrint.
        </p>

        <div style="font-size: 12px; font-weight: 700; color: #888; letter-spacing: 0.5px; margin: 20px 0 4px 0; text-align: left;">
            INFORMASI DOKUMEN
        </div>
        <div class="info-table">
            <div class="info-row">
                <div class="info-label">Jenis Dokumen</div>
                <div class="info-value">${escapeHtml(data.document_name || '-')}</div>
            </div>
            <div class="info-row">
                <div class="info-label">Nama Mahasiswa</div>
                <div class="info-value">${escapeHtml(data.user_name || '-')}</div>
            </div>
            <div class="info-row">
                <div class="info-label">NIM</div>
                <div class="info-value">${escapeHtml(data.user_nim || '-')}</div>
            </div>
            <div class="info-row">
                <div class="info-label">Tanggal Cetak</div>
                <div class="info-value">${escapeHtml(printedAt)}</div>
            </div>
            <div class="info-row">
                <div class="info-label">ID Verifikasi</div>
                <div class="info-value"><code style="font-size:12px;">${escapeHtml(data.doc_uuid || '-')}</code></div>
            </div>
        </div>

        ${dosenRows}

        <a href="/index.html" class="btn-home">
            <i class="bi bi-house"></i> Kembali ke Beranda
        </a>
    `;
    resultDiv.style.display = 'block';
}

function showInvalid(message) {
    document.getElementById('loadingState').style.display = 'none';
    const resultDiv = document.getElementById('resultState');
    resultDiv.innerHTML = `
        <div class="status-icon status-invalid">
            <i class="bi bi-shield-x"></i>
        </div>
        <div class="status-text status-invalid-text">TIDAK VALID</div>
        <p style="color:#666; font-size:14px; margin-bottom:24px;">${escapeHtml(message)}</p>
        <a href="/index.html" class="btn-home" style="background:#6c757d;">
            <i class="bi bi-house"></i> Kembali ke Beranda
        </a>
    `;
    resultDiv.style.display = 'block';
}

function escapeHtml(text) {
    if (text == null) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

verify();
</script>
</body>
</html>
