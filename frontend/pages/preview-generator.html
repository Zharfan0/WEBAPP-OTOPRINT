<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Preview Dokumen - OtoPrint</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --md-sys-color-primary: #006A42;
            --touch-target-min: 56px;
            --touch-spacing: 24px;
            --font-size-base: 18px;
            --font-size-large: 28px;
            --border-radius-card: 24px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ============ NAVBAR ============ */
        .navbar {
            background: linear-gradient(135deg, #006A42, #004d30);
            padding: 16px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .navbar-brand {
            font-size: 28px;
            font-weight: 700;
            color: white !important;
        }
        
        .navbar-brand i {
            margin-right: 12px;
            font-size: 32px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .user-avatar {
            width: 56px;
            height: 56px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #006A42;
            font-size: 24px;
        }
        
        .user-name {
            color: white;
            font-weight: 500;
            font-size: 18px;
        }
        
        .logout-btn {
            background: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
            padding: 12px 24px;
            min-width: 100px;
            border-radius: 48px;
            cursor: pointer;
            transition: all 0.1s ease;
            font-weight: 600;
            font-size: 16px;
        }
        
        .logout-btn:active {
            transform: scale(0.95);
            background: rgba(255, 215, 0, 0.2);
        }
        
        /* ============ PREVIEW SECTION ============ */
        .preview-section {
            flex: 1;
            padding: 40px 0 60px 0;
        }
        
        .preview-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .preview-title {
            font-size: var(--font-size-large);
            font-weight: 700;
            color: #006A42;
            margin-bottom: 12px;
        }
        
        .preview-subtitle {
            font-size: var(--font-size-base);
            color: #666;
        }
        
        /* ============ PDF CONTAINER ============ */
        .pdf-container {
            background: white;
            border-radius: var(--border-radius-card);
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            max-width: 1000px;
            margin: 0 auto 32px auto;
            min-height: 600px;
        }
        
        .pdf-viewer {
            width: 100%;
            height: 800px;
            border: 1px solid #e1e5e9;
            border-radius: 16px;
            overflow: hidden;
        }
        
        .pdf-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* ============ LOADING ============ */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 400px;
            gap: 20px;
        }
        
        .loading-spinner i {
            font-size: 64px;
            color: #006A42;
            animation: spin 1s linear infinite;
        }
        
        .loading-spinner p {
            font-size: 20px;
            color: #666;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* ============ TOMBOL ============ */
        .preview-actions {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-bottom: 40px;
        }
        
        .btn-cancel {
            padding: 18px 32px;
            min-width: 160px;
            border: 2px solid #6c757d;
            background: white;
            color: #6c757d;
            border-radius: 48px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.1s ease;
        }
        
        .btn-cancel:active {
            transform: scale(0.97);
            background-color: #6c757d;
            color: white;
        }
        
        .btn-print {
            padding: 18px 32px;
            min-width: 160px;
            border: none;
            background-color: #006A42;
            color: white;
            border-radius: 48px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
        }
        
        .btn-print:active {
            transform: scale(0.97);
            background-color: #005235;
        }
        
        .btn-print:disabled {
            background-color: #999;
            transform: none;
            cursor: not-allowed;
        }
        
        /* ============ SUCCESS PAGE ============ */
        .success-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
        }
        
        .success-container {
            background: white;
            border-radius: 32px;
            padding: 80px 48px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
            margin: 0 20px;
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background-color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }
        
        .success-icon i {
            font-size: 56px;
            color: white;
        }
        
        .success-title {
            font-size: 36px;
            font-weight: 700;
            color: #333;
            margin-bottom: 16px;
        }
        
        .success-subtitle {
            font-size: 24px;
            font-weight: 500;
            color: #333;
            margin-bottom: 24px;
        }
        
        .success-message {
            font-size: 18px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 40px;
        }
        
        .btn-return-home {
            padding: 16px 40px;
            border: 2px solid #006A42;
            background: white;
            color: #006A42;
            border-radius: 48px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-return-home:active {
            transform: scale(0.97);
            background-color: #006A42;
            color: white;
        }
        
        /* ============ FOOTER ============ */
        footer {
            background: linear-gradient(rgba(0, 64, 40, 0.85), rgba(0, 64, 40, 0.85));
            background-color: #004028;
            color: #fff;
            padding: 32px 0;
            margin-top: auto;
        }
        
        footer p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
            text-align: center;
        }
        
        /* ============ AFK MODAL ============ */
        .afk-modal {
            background: #f0f0f0;
            border: none;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-radius: 32px;
            overflow: hidden;
            max-width: 900px;
        }
        
        .afk-modal .modal-body {
            padding: 0;
            background: #f0f0f0;
        }
        
        .afk-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }
        
        .afk-modal-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .afk-text-content {
            padding: 48px 40px;
            text-align: center;
        }
        
        .afk-title {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
        }
        
        .afk-message {
            font-size: 18px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        
        .afk-finish-btn {
            background-color: #006A42;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 48px;
            font-size: 18px;
            font-weight: 600;
            min-width: 160px;
        }
        
        .afk-finish-btn:active {
            transform: scale(0.97);
            background-color: #005235;
        }
        
        @media (max-width: 768px) {
            .pdf-container {
                padding: 16px;
                margin: 0 16px 32px 16px;
            }
            .pdf-viewer {
                height: 500px;
            }
            .preview-actions {
                flex-direction: column;
                align-items: center;
                gap: 16px;
            }
            .btn-cancel, .btn-print {
                width: 80%;
                min-width: auto;
            }
            .success-container {
                padding: 48px 24px;
            }
            .user-name {
                display: none;
            }
            .navbar-brand {
                font-size: 22px;
            }
            .afk-text-content {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="container">
        <div class="navbar-brand">
            <i class="bi bi-printer"></i> Oto-Print
        </div>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">A</div>
            <span class="user-name" id="userName">Loading...</span>
            <button class="logout-btn" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>
</nav>

<!-- PREVIEW SECTION -->
<section class="preview-section">
    <div class="container">
        <div class="preview-header">
            <h1 class="preview-title">PREVIEW DOKUMEN</h1>
            <p class="preview-subtitle">Periksa kembali dokumen sebelum mencetak</p>
        </div>

        <div class="pdf-container">
            <div id="pdfViewer" class="pdf-viewer">
                <div class="loading-spinner">
                    <i class="bi bi-arrow-repeat"></i>
                    <p>Memproses dokumen...</p>
                </div>
            </div>
        </div>

        <div class="preview-actions">
            <a href="#" id="backLink" class="btn-cancel">Cancel</a>
            <button id="printBtn" class="btn-print">Cetak Sekarang</button>
        </div>
    </div>
</section>

<!-- AFK MODAL -->
<div class="modal fade" id="timeoutModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content afk-modal">
            <div class="modal-body">
                <div class="afk-content">
                    <div class="afk-image">
                        <img src="../assets/images/modal-afk.png" alt="AFK Modal" class="afk-modal-image" onerror="this.style.display='none'">
                    </div>
                    <div class="afk-text-content">
                        <h4 class="afk-title">Logout Otomatis</h4>
                        <p class="afk-message">Anda tidak aktif selama 45 detik. Sistem akan logout otomatis untuk keamanan.</p>
                        <button type="button" class="btn afk-finish-btn" id="afkFinishBtn">Kembali</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer>
    <div class="container text-center">
        <p>&copy; 2025 Oto-Print - Vending Machine Dokumen Akademik UMY</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
let currentPdfUrl = null;
let currentTemplateId = null;
let currentAllData = null;

// ============ AFK TIMER (SEDERHANA) ============
let afkTimer = null;
let logoutTimer = null;

function resetAfkTimer() {
    if (afkTimer) clearTimeout(afkTimer);
    afkTimer = setTimeout(() => {
        console.log('🔴 Modal muncul, 15 detik logout otomatis');
        
        // Tampilkan modal
        const modalEl = document.getElementById('timeoutModal');
        const modal = new bootstrap.Modal(modalEl, { backdrop: 'static', keyboard: false });
        modal.show();
        
        // Set auto logout 15 detik
        logoutTimer = setTimeout(() => {
            console.log('⏰ Auto logout');
            logout();
        }, 15000);
        
    }, 45000);
}

// ============ LOGOUT ============
async function logout() {
    console.log('🚪 Logout dipanggil');
    
    if (afkTimer) clearTimeout(afkTimer);
    if (logoutTimer) clearTimeout(logoutTimer);
    
    localStorage.removeItem('formData');
    sessionStorage.clear();
    
    try { await fetch('/api/logout', { method: 'POST' }); } catch(e) {}
    
    window.location.href = '/login.html';
}

// ============ EVENT LISTENER UNTUK TOMBOL ============
function setupEventListeners() {
    // Reset timer saat ada aktivitas
    const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'];
    events.forEach(event => {
        document.addEventListener(event, () => {
            if (afkTimer) resetAfkTimer();
        });
    });
    
    // Tombol logout manual
    document.getElementById('logoutBtn').addEventListener('click', logout);
    
    // Tombol print
    document.getElementById('printBtn').addEventListener('click', printDocument);
    
    // TOMBOL "KEMBALI" DI MODAL - langsung logout
    const finishBtn = document.getElementById('afkFinishBtn');
    finishBtn.addEventListener('click', (e) => {
        e.preventDefault();
        console.log('🟢 Tombol Kembali diklik -> langsung logout');
        
        // Tutup modal
        const modalEl = document.getElementById('timeoutModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
        
        // Langsung logout
        logout();
    });
}

// ============ SESSION CHECK ============
async function checkSession() {
    try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (!data.success) { window.location.href = '/login.html'; return null; }
        const name = data.user.name || data.user.nim;
        document.getElementById('userName').innerText = name;
        document.getElementById('userAvatar').innerText = name.charAt(0).toUpperCase();
        return data.user;
    } catch {
        window.location.href = '/login.html';
        return null;
    }
}

// ============ HELPERS ============
function getUrlParam(param) {
    return new URLSearchParams(window.location.search).get(param);
}

function formatDateIndonesian() {
    const months = ['Januari','Februari','Maret','April','Mei','Juni',
                    'Juli','Agustus','September','Oktober','November','Desember'];
    const d = new Date();
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function showError(viewer, message) {
    viewer.innerHTML = `
        <div style="text-align:center;padding:60px;color:#dc3545;">
            <i class="bi bi-exclamation-triangle" style="font-size:48px;"></i>
            <p class="mt-3" style="font-size:16px;">${message}</p>
        </div>`;
}

// ============ GENERATE PDF ============
async function generatePDF() {
    const viewer = document.getElementById('pdfViewer');
    viewer.innerHTML = `
        <div class="loading-spinner">
            <i class="bi bi-arrow-repeat"></i>
            <p>Memproses dokumen...</p>
        </div>`;

    currentTemplateId = getUrlParam('id');
    const storedData = localStorage.getItem('formData');

    if (!storedData) {
        alert('Tidak ada data form. Silakan isi form terlebih dahulu.');
        window.location.href = 'dashboard.html';
        return;
    }

    const currentFormData = JSON.parse(storedData);
    const date = new Date();
    const year = date.getFullYear();
    const month = date.getMonth() + 1; // Januari = 1

    // Format tanggal
    const formattedDate = formatDateIndonesian();

    // Tahun akademik
    let tahunAkademik;
    if (month >= 7) {
        tahunAkademik = `${year}/${year + 1}`;
    } else {
        tahunAkademik = `${year - 1}/${year}`;
    }

    // Semester Ganjil/Genap
    let semester;
    if ((month >= 8 && month <= 12) || month === 1) {
        semester = 'Ganjil';
    } else {
        semester = 'Genap';
    }

    const systemData = {
        tanggal: formattedDate,
        tanggal_surat: formattedDate,
        nomor_surat: `OTP/${year}/${Math.floor(Math.random() * 1000)}`,
        qr_code: `OTOPRINT-${Date.now()}`,
        tahun_akademik: tahunAkademik,
        semester: semester
    };

    const allData = { ...currentFormData.data };
    for (const field of currentFormData.fields || []) {
        if (field.data_source === 'SYSTEM') {
            const sourceKey = field.source_key || field.field_name;
            allData[field.field_name] = systemData[sourceKey] || '';
        }
    }
    currentAllData = allData;


    // 🔥 CEK APAKAH ADA FIELD MANUAL
    const hasManualFields = currentFormData.fields?.some(f => f.data_source === 'MANUAL') || false;
    
    // 🔥 SET TOMBOL CANCEL BERDASARKAN ADA/TIDAKNYA MANUAL FIELD
    const backLink = document.getElementById('backLink');
    if (hasManualFields) {
        // Ada manual field -> cancel kembali ke form
        backLink.href = `form-generator.html?id=${currentTemplateId}`;
        backLink.textContent = 'Kembali';
    } else {
        // Tidak ada manual field -> cancel langsung ke dashboard
        backLink.href = 'dashboard.html';
        backLink.textContent = 'Kembali ke Dashboard';
    }

    try {
        const response = await fetch('/api/generate-pdf', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                templateId: currentTemplateId,
                allData: allData,
                fields: currentFormData.fields
            })
        });

        if (!response.ok) throw new Error(`Server error ${response.status}`);
        const result = await response.json();

        console.log('📥 Response:', result.success, '| error:', result.error);
        console.log('📄 pdfBase64 length:', result.pdfBase64?.length);

        if (!result.success || !result.pdfBase64) {
            throw new Error(result.error || 'Respons tidak valid');
        }

        const binary = window.atob(result.pdfBase64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        const blob = new Blob([bytes], { type: 'application/pdf' });

        if (currentPdfUrl) URL.revokeObjectURL(currentPdfUrl);
        currentPdfUrl = URL.createObjectURL(blob);

        viewer.innerHTML = `<iframe src="${currentPdfUrl}" style="width:100%;height:100%;border:none;"></iframe>`;
        document.getElementById('printBtn').disabled = false;

    } catch (error) {
        console.error('Generate error:', error);
        showError(viewer, error.message);
    }

    console.log('📦 Data yang diterima dari localStorage:', allData);
    console.log('📦 Field list:', currentFormData.fields);
}

// ============ PRINT ============
async function printDocument() {
    if (!currentPdfUrl) {
        alert('Dokumen belum siap');
        return;
    }

    const printBtn = document.getElementById('printBtn');
    printBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Mencetak...';
    printBtn.disabled = true;

    try {
        const res = await fetch('/api/print-to-printer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                templateId: currentTemplateId,
                allData: currentAllData,
                document_type_id: currentTemplateId
            })
        });

        const result = await res.json();

        if (result.success) {
            localStorage.removeItem('formData');
            showSuccessPage();
        } else {
            throw new Error(result.error || 'Gagal mencetak');
        }
    } catch (error) {
        console.error('Print error:', error);
        alert('Gagal mencetak: ' + error.message);
        printBtn.innerHTML = 'Cetak Sekarang';
        printBtn.disabled = false;
    }
}

// ============ SUCCESS PAGE ============
function showSuccessPage() {
    document.querySelector('.preview-section').style.display = 'none';
    
    const successHTML = `
        <section class="success-section">
            <div class="success-container">
                <div class="success-icon"><i class="bi bi-check-lg"></i></div>
                <h2 class="success-title">Berhasil!</h2>
                <p class="success-subtitle">Dokumen Sedang Dicetak</p>
                <p class="success-message">Dokumen Anda sedang diproses dan dikirim ke printer.<br>Silakan ambil hasil cetakan Anda.</p>
                <a href="dashboard.html" class="btn-return-home"><i class="bi bi-house"></i> Kembali ke Beranda</a>
            </div>
        </section>
    `;
    document.querySelector('footer').insertAdjacentHTML('beforebegin', successHTML);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', async () => {
    await checkSession();
    
    // Setup semua event listeners
    setupEventListeners();
    
    // Start AFK timer
    resetAfkTimer();
    
    document.getElementById('printBtn').disabled = true;
    
    await generatePDF();
});
</script>
</body>
</html>
