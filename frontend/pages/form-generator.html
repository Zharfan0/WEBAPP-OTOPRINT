<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Form Dokumen - OtoPrint</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- JSZip for DOCX manipulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>

    <style>
        :root {
            --md-sys-color-primary: #006A42;
            --touch-target-min: 56px;
            --touch-spacing: 24px;
            --font-size-base: 18px;
            --font-size-large: 28px;
            --border-radius-card: 24px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ============ NAVBAR TOUCH ============ */
        .navbar {
            background: linear-gradient(135deg, #006A42, #004d30);
            padding: 16px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .navbar-brand {
            font-size: 28px;
            font-weight: 700;
            color: white !important;
        }
        
        .navbar-brand i {
            margin-right: 12px;
            font-size: 32px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .user-avatar {
            width: 56px;
            height: 56px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #006A42;
            font-size: 24px;
        }
        
        .user-name {
            color: white;
            font-weight: 500;
            font-size: 18px;
        }
        
        .logout-btn {
            background: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
            padding: 12px 24px;
            min-width: 100px;
            border-radius: 48px;
            cursor: pointer;
            transition: all 0.1s ease;
            font-weight: 600;
            font-size: 16px;
        }
        
        .logout-btn:active {
            transform: scale(0.95);
            background: rgba(255, 215, 0, 0.2);
        }
        
        /* ============ FORM SECTION ============ */
        .form-section {
            flex: 1;
            padding: 48px 0 60px 0;
        }
        
        .form-container {
            background: white;
            border-radius: var(--border-radius-card);
            padding: 48px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            max-width: 800px;
            margin: 0 auto;
        }
        
        .form-title {
            color: #006A42;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            text-align: center;
        }
        
        .form-subtitle {
            font-size: var(--font-size-large);
            font-weight: 700;
            color: #333;
            margin-bottom: 40px;
            text-align: center;
        }
        
        /* ============ FORM GROUP TOUCH ============ */
        .form-group {
            margin-bottom: 32px;
        }
        
        .form-label {
            display: block;
            font-size: var(--font-size-base);
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .form-label .required {
            color: #dc3545;
            font-size: 18px;
        }
        
        .auto-badge {
            background: #e3f2fd;
            color: #0d6efd;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-left: 10px;
            display: inline-block;
        }
        
        .form-control {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 16px;
            font-size: var(--font-size-base);
            transition: all 0.2s ease;
            outline: none;
            background-color: #f8f9fa;
        }
        
        .form-control:focus {
            border-color: #006A42;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(0, 106, 66, 0.1);
        }
        
        .form-control[readonly] {
            background-color: #e9ecef;
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        /* ============ TOMBOL TOUCH ============ */
        .form-actions {
            display: flex;
            gap: 20px;
            margin-top: 48px;
            justify-content: center;
        }
        
        .btn-cancel {
            flex: 1;
            padding: 18px 24px;
            border: 2px solid #6c757d;
            background: white;
            color: #6c757d;
            border-radius: 48px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.1s ease;
        }
        
        .btn-cancel:active {
            transform: scale(0.97);
            background-color: #6c757d;
            color: white;
        }
        
        .btn-submit {
            flex: 1;
            padding: 18px 24px;
            border: none;
            background-color: #006A42;
            color: white;
            border-radius: 48px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
        }
        
        .btn-submit:active {
            transform: scale(0.97);
            background-color: #005235;
        }
        
        .btn-submit:disabled {
            background-color: #999;
            transform: none;
            cursor: not-allowed;
        }
        
        /* ============ LOADING ============ */
        .loading {
            text-align: center;
            padding: 80px;
        }
        
        .loading i {
            font-size: 56px;
            color: #006A42;
            animation: spin 1s linear infinite;
        }
        
        .loading p {
            font-size: 18px;
            margin-top: 20px;
            color: #666;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* ============ FOOTER ============ */
        footer {
            background: linear-gradient(rgba(0, 64, 40, 0.85), rgba(0, 64, 40, 0.85));
            background-color: #004028;
            color: #fff;
            padding: 32px 0;
            margin-top: auto;
        }
        
        footer p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
            text-align: center;
        }
        
        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .form-container {
                padding: 32px 24px;
                margin: 0 16px;
            }
            
            .form-subtitle {
                font-size: 24px;
            }
            
            .form-actions {
                flex-direction: column;
                gap: 16px;
            }
            
            .btn-cancel, .btn-submit {
                width: 100%;
            }
            
            .user-name {
                display: none;
            }
            
            .navbar-brand {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR TOUCH-FRIENDLY -->
<nav class="navbar">
    <div class="container">
        <div class="navbar-brand">
            <i class="bi bi-printer"></i> Oto-Print
        </div>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">A</div>
            <span class="user-name" id="userName">Loading...</span>
            <button class="logout-btn" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>
</nav>

<!-- FORM SECTION -->
<section class="form-section">
    <div class="container">
        <div class="form-container">
            <div id="formContent">
                <div class="loading">
                    <i class="bi bi-arrow-repeat"></i>
                    <p>Memuat form...</p>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <div class="container text-center">
        <p>&copy; 2025 Oto-Print - Vending Machine Dokumen Akademik UMY</p>
    </div>
</footer>

<script>
let currentUser = null;
let currentTemplate = null;
let currentFields = [];

// ============ GET URL PARAMETER ============
function getUrlParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
}

// ============ SESSION CHECK ============
async function checkSession() {
    try {
        const response = await fetch('/api/me');
        const data = await response.json();
        
        if (!data.success) {
            window.location.href = '/login.html';
            return null;
        }
        
        currentUser = data.user;
        const userName = currentUser.name || currentUser.nim;
        document.getElementById('userName').innerText = userName;
        document.getElementById('userAvatar').innerText = userName.charAt(0).toUpperCase();
        
        return currentUser;
    } catch (error) {
        window.location.href = '/login.html';
        return null;
    }
}

// ============ LOAD TEMPLATE AND FIELDS ============
async function loadTemplateAndFields() {
    const templateId = getUrlParam('id');
    
    if (!templateId) {
        alert('Template tidak ditemukan');
        window.location.href = '/pages/dashboard.html';
        return;
    }
    
    try {
        // Load template info
        const templateRes = await fetch(`/api/user/templates/${templateId}`);
        const templateData = await templateRes.json();
        
        console.log('Template data:', templateData);
        
        if (templateData.id) {
            currentTemplate = templateData;
        } else if (templateData.template) {
            currentTemplate = templateData.template;
        } else {
            throw new Error('Invalid template data structure');
        }
        
        // Load fields
        const fieldsRes = await fetch(`/api/user/templates/${templateId}/fields`);
        currentFields = await fieldsRes.json();
        
        console.log('Loaded template:', currentTemplate);
        console.log('Loaded fields:', currentFields);
        
        renderForm();
        
    } catch (error) {
        console.error('Load template error:', error);
        document.getElementById('formContent').innerHTML = `
            <div class="text-center text-danger">
                <i class="bi bi-exclamation-triangle" style="font-size: 64px;"></i>
                <p class="mt-3" style="font-size: 18px;">Gagal memuat form. Template tidak ditemukan.</p>
                <a href="dashboard.html" class="btn-cancel" style="display: inline-block; margin-top: 20px;">Kembali ke Dashboard</a>
            </div>
        `;
    }
}

// ============ GET AUTO DATA FROM USER SESSION ============
function getAutoData(fieldName, sourceKey) {
    const userData = {
        name: currentUser.name || '',
        nim: currentUser.nim || '',
        prodi: 'Teknologi Informasi',
        ipk: '3.75',
        sks: '110'
    };
    
    return userData[sourceKey] || '';
}

// ======== SYSTEM DATA CODE =========
// ============ GET AUTO DATA ============
function getAutoData(fieldName, sourceKey) {
    const userData = {
        name: currentUser?.name || '',
        nim: currentUser?.nim || '',
        prodi: 'Teknologi Informasi',
        ipk: '3.75',
        sks: '110'
    };
    return userData[sourceKey] || '';
}

// ============ GENERATE SYSTEM DATA ============
function generateSystemData() {
    const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const date = new Date();
    const formattedDate = `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    
    return {
        tanggal: formattedDate,
        tanggal_surat: formattedDate,
        nomor_surat: `OTP/${date.getFullYear()}/${Math.floor(Math.random() * 1000)}`,
        qr_code: `OTOPRINT-${Date.now()}`,
        qr_signature: `OTOPRINT-${Date.now()}`
    };
}

// ============ RENDER FORM DYNAMICALLY ============
function renderForm() {
    const container = document.getElementById('formContent');
    
    if (!currentTemplate) {
        container.innerHTML = '<div class="loading">Memuat template...</div>';
        return;
    }
    
    if (!currentFields.length) {
        container.innerHTML = `
            <div class="text-center">
                <i class="bi bi-info-circle" style="font-size: 48px; color: #006A42;"></i>
                <p class="mt-2">Template ini belum memiliki field. Silakan hubungi admin.</p>
                <a href="dashboard.html" class="btn-cancel" style="display: inline-block;">Kembali ke Dashboard</a>
            </div>
        `;
        return;
    }
    
    // 🔥 HANYA field MANUAL yang ditampilkan di FORM (karena hanya ini yang perlu diisi user)
    const manualFields = currentFields.filter(f => f.data_source === 'MANUAL');
    
    // Sort by order
    const sortedFields = [...manualFields].sort((a, b) => (a.field_order || 0) - (b.field_order || 0));
    
    let fieldsHtml = '';
    
    for (const field of sortedFields) {
        const inputType = field.field_type === 'number' ? 'number' : (field.field_type === 'date' ? 'date' : 'text');
        
        fieldsHtml += `
            <div class="form-group">
                <label class="form-label">
                    ${escapeHtml(field.label)} <span class="required">*</span>
                </label>
                <input type="${inputType}" 
                       class="form-control" 
                       id="field_${field.id}" 
                       name="${field.field_name}"
                       required
                       placeholder="Masukkan ${escapeHtml(field.label.toLowerCase())}">
            </div>
        `;
    }
    
    // Jika tidak ada field MANUAL
    if (sortedFields.length === 0) {
        container.innerHTML = `
            <div class="text-center py-4">
                <i class="bi bi-check-circle" style="font-size: 48px; color: #006A42;"></i>
                <p class="mt-3">Tidak ada data yang perlu diisi. Klik "Preview" untuk melanjutkan.</p>
                <div class="form-actions" style="margin-top: 30px;">
                    <a href="dashboard.html" class="btn-cancel">Cancel</a>
                    <button id="directPreviewBtn" class="btn-submit">Preview Dokumen</button>
                </div>
            </div>
        `;
        
        document.getElementById('directPreviewBtn')?.addEventListener('click', () => {
            // Tetap siapkan data untuk field AUTO_KRS, SYSTEM, MASTER_SIGNATURE
            const formData = {};
            for (const field of currentFields) {
                if (field.data_source === 'SYSTEM') {
                    const systemData = generateSystemData();
                    formData[field.field_name] = systemData[field.source_key] || '';
                } else if (field.data_source === 'AUTO_KRS') {
                    formData[field.field_name] = getAutoData(field.field_name, field.source_key);
                } else if (field.data_source === 'MASTER_SIGNATURE') {
                    formData[field.field_name] = null;
                }
            }
            
            const storageData = {
                templateId: currentTemplate.id,
                templateName: currentTemplate.name_id,
                fields: currentFields,
                data: formData
            };
            localStorage.setItem('formData', JSON.stringify(storageData));
            window.location.href = `preview-generator.html?id=${currentTemplate.id}`;
        });
        return;
    }
    
    container.innerHTML = `
        <div class="form-title">FORMULIR DOKUMEN</div>
        <h2 class="form-subtitle">${escapeHtml(currentTemplate.name_id || 'Form Dokumen')}</h2>
        
        <form id="dynamicForm">
            ${fieldsHtml}
            
            <div class="form-actions">
                <a href="dashboard.html" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit">Preview Dokumen</button>
            </div>
        </form>
    `;
    
    document.getElementById('dynamicForm').addEventListener('submit', handleSubmit);
}

function handleSubmit(e) {
    e.preventDefault();
    
    if (!currentTemplate) {
        alert('Data template tidak ditemukan. Silakan refresh halaman.');
        return;
    }
    
    const formData = {};
    
    // 🔥 Proses SEMUA field (termasuk yang tidak ditampilkan)
    for (const field of currentFields) {
        // SYSTEM: generate otomatis
        if (field.data_source === 'SYSTEM') {
            const systemData = generateSystemData();
            formData[field.field_name] = systemData[field.source_key] || '';
            continue;
        }
        
        // MASTER_SIGNATURE: null (nanti di preview diisi backend)
        if (field.data_source === 'MASTER_SIGNATURE') {
            formData[field.field_name] = null;
            continue;
        }
        
        // AUTO_KRS: ambil dari session user
        if (field.data_source === 'AUTO_KRS') {
            const autoValue = getAutoData(field.field_name, field.source_key);
            formData[field.field_name] = autoValue;
            continue;
        }
        
        // MANUAL: ambil dari input form
        if (field.data_source === 'MANUAL') {
            const input = document.getElementById(`field_${field.id}`);
            if (input) {
                if (!input.value.trim()) {
                    alert(`Field "${field.label}" wajib diisi`);
                    input.focus();
                    if (navigator.vibrate) navigator.vibrate(100);
                    return;
                }
                formData[field.field_name] = input.value;
            }
        }
    }
    
    console.log('Form data:', formData);
    
    // Store to localStorage
    const storageData = {
        templateId: currentTemplate.id,
        templateName: currentTemplate.name_id,
        fields: currentFields,
        data: formData
    };
    
    localStorage.setItem('formData', JSON.stringify(storageData));
    
    // Redirect to preview
    const submitBtn = document.querySelector('.btn-submit');
    submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Memproses...';
    submitBtn.disabled = true;
    
    setTimeout(() => {
        window.location.href = `preview-generator.html?id=${currentTemplate.id}`;
    }, 300);
}

// ============ LOGOUT ============
async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    sessionStorage.clear();
    window.location.href = '/login.html';
}

// ============ UTILITIES ============
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', async () => {
    const user = await checkSession();
    if (user) {
        await loadTemplateAndFields();
    }
    
    document.getElementById('logoutBtn').addEventListener('click', logout);
});
</script>
</body>
</html>
