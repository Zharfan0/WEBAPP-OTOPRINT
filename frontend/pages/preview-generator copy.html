<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OtoPrint - Preview Dokumen</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Google Fonts - Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- JSZip for DOCX manipulation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  
  <!-- DOCX Preview Library -->
  <script src="https://unpkg.com/docx-preview@0.3.0/dist/docx-preview.min.js"></script>

  <style>
    :root {
      --md-sys-color-primary: #006A42;
      --touch-target-min: 56px;
      --touch-spacing: 24px;
      --font-size-base: 18px;
      --font-size-large: 28px;
      --border-radius-card: 24px;
    }
    
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: linear-gradient(135deg, #006A42, #004d30);
      padding: 16px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    
    .navbar-brand {
      font-size: 28px;
      font-weight: 700;
      color: white !important;
    }
    
    .navbar-brand i {
      margin-right: 12px;
      font-size: 32px;
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .user-avatar {
      width: 56px;
      height: 56px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #006A42;
      font-size: 24px;
    }
    
    .user-name {
      color: white;
      font-weight: 500;
      font-size: 18px;
    }
    
    .logout-btn {
      background: transparent;
      border: 2px solid #FFD700;
      color: #FFD700;
      padding: 12px 24px;
      min-width: 100px;
      border-radius: 48px;
      cursor: pointer;
      transition: all 0.1s ease;
      font-weight: 600;
      font-size: 16px;
    }
    
    .logout-btn:active {
      transform: scale(0.95);
      background: rgba(255, 215, 0, 0.2);
    }

    .preview-section {
      flex: 1;
      padding: 40px 0 60px 0;
    }

    .preview-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .preview-title {
      font-size: var(--font-size-large);
      font-weight: 700;
      color: #006A42;
      margin-bottom: 12px;
    }

    .preview-subtitle {
      font-size: var(--font-size-base);
      color: #666;
    }

    .document-container {
      background: white;
      border-radius: var(--border-radius-card);
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      max-width: 1000px;
      margin: 0 auto 32px auto;
      min-height: 600px;
    }

    .docx-preview-container {
      width: 100%;
      min-height: 600px;
      border: 1px solid #e1e5e9;
      border-radius: 16px;
      overflow: auto;
    }

    .loading-spinner {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 400px;
      gap: 20px;
    }
    
    .loading-spinner i {
      font-size: 64px;
      color: #006A42;
      animation: spin 1s linear infinite;
    }
    
    .loading-spinner p {
      font-size: 20px;
      color: #666;
    }

    .error-message {
      text-align: center;
      padding: 48px;
      color: #dc3545;
      background-color: #f8d7da;
      border-radius: 16px;
      margin: 20px 0;
      font-size: 18px;
    }

    .preview-actions {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 40px;
    }

    .btn-cancel {
      padding: 18px 32px;
      min-width: 160px;
      border: 2px solid #6c757d;
      background: white;
      color: #6c757d;
      border-radius: 48px;
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.1s ease;
    }

    .btn-cancel:active {
      transform: scale(0.97);
      background-color: #6c757d;
      color: white;
    }

    .btn-print {
      padding: 18px 32px;
      min-width: 160px;
      border: none;
      background-color: #006A42;
      color: white;
      border-radius: 48px;
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.1s ease;
      text-align: center;
    }

    .btn-print:active {
      transform: scale(0.97);
      background-color: #005235;
    }
    
    .btn-print:disabled {
      background-color: #999;
      transform: none;
      cursor: not-allowed;
    }

    .success-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
    }

    .success-container {
      background: white;
      border-radius: 32px;
      padding: 80px 48px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px;
      width: 100%;
      margin: 0 20px;
    }

    .success-icon {
      width: 100px;
      height: 100px;
      background-color: #28a745;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
    }

    .success-icon i {
      font-size: 56px;
      color: white;
    }

    .success-title {
      font-size: 36px;
      font-weight: 700;
      color: #333;
      margin-bottom: 16px;
    }

    .success-subtitle {
      font-size: 24px;
      font-weight: 500;
      color: #333;
      margin-bottom: 24px;
    }

    .success-message {
      font-size: 18px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .btn-return-home {
      padding: 16px 40px;
      border: 2px solid #006A42;
      background: white;
      color: #006A42;
      border-radius: 48px;
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-return-home:active {
      transform: scale(0.97);
      background-color: #006A42;
      color: white;
    }

    footer {
      background: linear-gradient(rgba(0, 64, 40, 0.85), rgba(0, 64, 40, 0.85));
      background-color: #004028;
      color: #fff;
      padding: 32px 0;
      margin-top: auto;
    }

    footer p {
      margin: 0;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
    }

    .afk-modal {
      background: #f0f0f0;
      border: none;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border-radius: 32px;
      overflow: hidden;
      max-width: 900px;
    }

    .afk-modal .modal-body {
      padding: 0;
      background: #f0f0f0;
    }

    .afk-image {
      width: 100%;
      height: 200px;
      overflow: hidden;
    }

    .afk-modal-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .afk-text-content {
      padding: 48px 40px;
      text-align: center;
    }

    .afk-title {
      font-size: 32px;
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
    }

    .afk-message {
      font-size: 18px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .afk-finish-btn {
      background-color: #006A42;
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 48px;
      font-size: 18px;
      font-weight: 600;
      min-width: 160px;
    }

    .afk-finish-btn:active {
      transform: scale(0.97);
      background-color: #005235;
    }

    @media (max-width: 768px) {
      .document-container {
        padding: 20px;
        margin: 0 16px 32px 16px;
      }
      .preview-actions {
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .btn-cancel, .btn-print {
        width: 80%;
        min-width: auto;
      }
      .success-container {
        padding: 48px 24px;
      }
      .success-title {
        font-size: 28px;
      }
      .success-subtitle {
        font-size: 20px;
      }
      .user-name {
        display: none;
      }
      .navbar-brand {
        font-size: 22px;
      }
      .afk-text-content {
        padding: 32px 24px;
      }
      .afk-title {
        font-size: 26px;
      }
      .afk-message {
        font-size: 16px;
      }
    }

    @media print {
      .navbar, .preview-header, .preview-actions, footer, .logout-btn,
      .btn-cancel, .btn-print, #logoutBtn, #printBtn, .afk-modal,
      .modal, .user-info, .navbar-brand {
        display: none !important;
      }
      body { background: white !important; margin: 0 !important; padding: 0 !important; }
      .preview-section { padding: 0 !important; margin: 0 !important; background: white !important; }
      .document-container { box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; max-width: 100% !important; background: white !important; }
      .docx-preview-container { border: none !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; }
      .docx-preview-container * { background: transparent !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>

<body>

<nav class="navbar">
  <div class="container">
    <div class="navbar-brand">
      <i class="bi bi-printer"></i> Oto-Print
    </div>
    <div class="user-info">
      <div class="user-avatar" id="userAvatar">A</div>
      <span class="user-name" id="userName">Loading...</span>
      <button class="logout-btn" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>
</nav>

<section class="preview-section">
  <div class="container">
    <div class="preview-header">
      <h1 class="preview-title">PREVIEW DOKUMEN</h1>
      <p class="preview-subtitle">Periksa kembali dokumen sebelum mencetak</p>
    </div>

    <div class="document-container" id="documentPreview">

<div class="modal fade" id="timeoutModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">

      <div class="modal-body">
        <div class="afk-content">

          </div>

            <h4 class="afk-title">Logout Otomatis</h4>
            <p class="afk-message">Anda tidak aktif selama 45 detik. Sistem akan logout otomatis untuk keamanan.</p>
            <button type="button" class="btn afk-finish-btn" id="afkFinishBtn">Kembali</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="container text-center">
    <p>&copy; 2025 Oto-Print - Vending Machine Dokumen Akademik UMY</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
let processedDocxBlob = null;
let currentTemplateId = null;
let currentFormData = null;
let sessionTimeout = null;

// ============ SESSION TIMEOUT AFK ============
class SessionTimeout {
  constructor() {
    this.timeoutDuration = 45000;
    this.timeoutTimer = null;
    this.modalActive = false;
    this.modal = new bootstrap.Modal(document.getElementById('timeoutModal'));
    this.init();
  }
  
  init() {
    const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'];
    events.forEach(event => {
      document.addEventListener(event, (e) => {
        if (this.modalActive) return;
        this.resetTimeout();
      }, true);
    });
    
    document.getElementById('afkFinishBtn').addEventListener('click', () => {
      this.modal.hide();
      this.resetTimeout();
    });
    
    this.modal._element.addEventListener('shown.bs.modal', () => { this.modalActive = true; });
    this.modal._element.addEventListener('hidden.bs.modal', () => { this.modalActive = false; });
    this.resetTimeout();
  }
  
  resetTimeout() {
    if (this.modalActive) return;
    if (this.timeoutTimer) clearTimeout(this.timeoutTimer);
    if (this.modal._isShown) this.modal.hide();
    this.timeoutTimer = setTimeout(() => this.showWarning(), this.timeoutDuration);
  }
  
  showWarning() { this.modalActive = true; this.modal.show(); }
  
  async logout() {
    this.modalActive = false;
    if (this.timeoutTimer) clearTimeout();
    await fetch('/api/logout', { method: 'POST' });
    sessionStorage.clear();
    localStorage.removeItem('formData');
    window.location.href = '/login.html';
  }
}

// ============ GET URL PARAMETER ============
function getUrlParam(param) {
    return new URLSearchParams(window.location.search).get(param);
}

// ============ SESSION CHECK ============
async function checkSession() {
    try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (!data.success) {
            window.location.href = '/login.html';
            return null;
        }
        const userName = data.user.name || data.user.nim;
        document.getElementById('userName').innerText = userName;
        document.getElementById('userAvatar').innerText = userName.charAt(0).toUpperCase();
        return data.user;
    } catch (error) {
        window.location.href = '/login.html';
        return null;
    }
}

// ============ FORMAT TANGGAL ============
function formatDateIndonesian() {
    const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const date = new Date();
    return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
}

// ============ GENERATE SYSTEM DATA ============
function generateSystemData() {
    const date = new Date();
    return {
        tanggal: formatDateIndonesian(),
        tanggal_surat: formatDateIndonesian(),
        nomor_surat: `OTP/${date.getFullYear()}/${Math.floor(Math.random() * 1000)}`,
        qr_code: `OTOPRINT-${Date.now()}`
    };
}

// ============ GET SIGNATURE NAME (UNTUK PREVIEW TEKS) ============
async function getSignatureName(signatureId) {
    try {
        const res = await fetch(`/api/user/signatures/${signatureId}`);
        if (res.ok) {
            const sig = await res.json();
            return sig.nama_dosen || `Signature ${signatureId}`;
        }
        return `Tanda Tangan ID: ${signatureId}`;
    } catch (error) {
        return `Tanda Tangan ID: ${signatureId}`;
    }
}

// ============ SHOW SUCCESS PAGE ============
function showSuccessPage() {
    const ps = document.querySelector('.preview-section');
    ps.innerHTML = `
        <div class="success-container">
            <div class="success-icon"><i class="bi bi-check"></i></div>
            <h1 class="success-title">SUKSES</h1>
            <h2 class="success-subtitle">Dokumen Sedang Dicetak</h2>
            <p class="success-message">Terima kasih telah menggunakan Oto-Print. Dokumen Anda sedang dicetak. Silakan ambil dokumen di printer.</p>
            <a href="dashboard.html" class="btn-return-home">Kembali ke Dashboard</a>
        </div>
    `;
    ps.className = 'success-section';
}

// ============ LOAD AND PROCESS DOCX ============
async function loadAndProcessDocx() {
    currentTemplateId = getUrlParam('id');
    const storedData = localStorage.getItem('formData');
    
    if (!storedData) {
        alert('Tidak ada data form. Silakan isi form terlebih dahulu.');
        window.location.href = 'dashboard.html';
        return;
    }
    
    currentFormData = JSON.parse(storedData);
    const systemData = generateSystemData();
    
    // Generate QR data
    const docId = `${Date.now()}-${currentTemplateId}-${currentFormData.data?.nim || 'user'}`;
    const verificationUrl = `https://otoprint.umy.ac.id/verify?id=${docId}`;
    const encodedUrl = encodeURIComponent(verificationUrl);
    const qrImageForPrint = `https://quickchart.io/qr?text=${encodedUrl}&size=150`;
    
    let hasQrField = false;
    if (currentFormData.fields) {
        hasQrField = currentFormData.fields.some(f => 
            f.data_source === 'SYSTEM' && (f.source_key === 'qr_code' || f.field_name === 'qr_code')
        );
    }
    
    if (hasQrField) {
        systemData.qr_code = verificationUrl;
        systemData.qr_code_image = qrImageForPrint;
    }
    
    // Gabungkan semua data
    const allData = { ...currentFormData.data };
    
    for (const field of currentFormData.fields || []) {
        if (field.data_source === 'MASTER_SIGNATURE') {
            // PREVIEW: tampilkan teks nama dosen (bukan gambar)
            const signatureId = field.source_key;
            const signatureName = await getSignatureName(signatureId);
            allData[field.field_name] = `[TANDA TANGAN: ${signatureName}]`;
        }
        else if (field.data_source === 'SYSTEM') {
            const sourceKey = field.source_key || field.field_name;
            if (field.field_name === 'QR_MARKER' || sourceKey === 'qr_code') {
                allData[field.field_name] = '[QR CODE]';
            } else {
                allData[field.field_name] = systemData[sourceKey] || `[${field.field_name}]`;
            }
        }
    }
    
    console.log('All data:', allData);
    
    try {
        const templateRes = await fetch(`/api/user/templates/${currentTemplateId}`);
        const template = await templateRes.json();
        
        if (!template || !template.file_path) throw new Error('Template tidak memiliki file');
        
        const filePath = `/${template.file_path}`;
        const response = await fetch(filePath);
        if (!response.ok) throw new Error(`Template not found: ${filePath}`);
        
        const arrayBuffer = await response.arrayBuffer();
        const zip = new JSZip();
        const docx = await zip.loadAsync(arrayBuffer);
        let documentXml = await docx.file('word/document.xml').async('string');
        
        for (const [key, value] of Object.entries(allData)) {
            const placeholder = new RegExp(`{{${key}}}`, 'g');
            let replaceValue = value || '';
            if (typeof replaceValue !== 'string') replaceValue = String(replaceValue);
            
            // Field signature (teks biasa, di-escape)
            replaceValue = replaceValue
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            
            documentXml = documentXml.replace(placeholder, replaceValue);
        }
        
        docx.file('word/document.xml', documentXml);
        processedDocxBlob = await docx.generateAsync({ type: 'blob' });
        
        await renderDocxPreview(processedDocxBlob);
        document.getElementById('backLink').href = `form-generator.html?id=${currentTemplateId}`;
        
    } catch (error) {
        console.error(error);
        showError(error.message);
    }
}

// ============ RENDER PREVIEW ============
async function renderDocxPreview(docxBlob) {
    const loadingSpinner = document.getElementById('loadingSpinner');
    const errorMsg = document.getElementById('errorMessage');
    const preview = document.getElementById('docxPreview');
    
    loadingSpinner.style.display = 'none';
    errorMsg.style.display = 'none';
    preview.style.display = 'block';
    preview.innerHTML = '';
    
    try {
        if (typeof window.docx !== 'undefined' && window.docx.renderAsync) {
            await window.docx.renderAsync(docxBlob, preview);
        } else if (typeof docx !== 'undefined' && docx.renderAsync) {
            await docx.renderAsync(docxBlob, preview);
        } else if (typeof docxPreview !== 'undefined' && docxPreview.renderAsync) {
            await docxPreview.renderAsync(docxBlob, preview);
        } else {
            throw new Error('Library preview tidak tersedia');
        }
        console.log('Preview rendered successfully');
    } catch (error) {
        preview.style.display = 'none';
        errorMsg.style.display = 'block';
        errorMsg.innerHTML = `
            <i class="bi bi-exclamation-triangle" style="font-size: 48px;"></i>
            <h5>Preview Tidak Tersedia</h5>
            <p>${error.message}</p>
            <p>Dokumen tetap bisa dicetak. Klik tombol "Cetak Sekarang".</p>
        `;
    }
}

function showError(message) {
    document.getElementById('loadingSpinner').style.display = 'none';
    const errorMsg = document.getElementById('errorMessage');
    errorMsg.style.display = 'block';
    errorMsg.innerHTML = `<i class="bi bi-exclamation-triangle" style="font-size: 48px;"></i><h5>Error</h5><p>${message}</p>`;
}

// ============ PRINT ============
async function printDocument() {
    if (!processedDocxBlob) {
        alert('Dokumen belum siap');
        return;
    }
    
    const reader = new FileReader();
    reader.onloadend = async function() {
        const base64Data = reader.result.split(',')[1];
        
        const printBtn = document.getElementById('printBtn');
        const originalText = printBtn.innerHTML;
        printBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Mencetak...';
        printBtn.disabled = true;
        
        try {
            const res = await fetch('/api/print-to-printer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    docxBuffer: base64Data,
                    document_type_id: currentTemplateId
                })
            });
            
            const result = await res.json();
            if (result.success) {
                localStorage.removeItem('formData');
                showSuccessPage();
            } else {
                alert('Gagal mencetak: ' + (result.error || 'Unknown error'));
                printBtn.innerHTML = originalText;
                printBtn.disabled = false;
            }
        } catch (error) {
            alert('Gagal terhubung ke server');
            printBtn.innerHTML = originalText;
            printBtn.disabled = false;
        }
    };
    reader.readAsDataURL(processedDocxBlob);
}

// ============ LOGOUT ============
async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    sessionStorage.clear();
    window.location.href = '/login.html';
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', async () => {
    await checkSession();
    await loadAndProcessDocx();
    sessionTimeout = new SessionTimeout();
