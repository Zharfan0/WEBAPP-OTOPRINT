<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Insight - OtoPrint</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  display: flex;
  background: #f0f2f5;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: #1a1a2e;
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  box-shadow: 2px 0 10px rgba(0,0,0,0.1);
}

.logo {
  padding: 24px 20px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 20px;
}

.logo img {
  max-width: 120px;
  height: auto;
}

.logo h3 {
  color: white;
  margin-top: 10px;
  font-size: 16px;
}

.menu-item {
  padding: 14px 24px;
  cursor: pointer;
  color: #ccc;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.3s ease;
}

.menu-item i {
  font-size: 20px;
  width: 24px;
}

.menu-item:hover {
  background: rgba(255,255,255,0.1);
  color: white;
}

.menu-item.active {
  background: #006A42;
  color: white;
  border-left: 4px solid #FFD700;
}

.logout {
  margin: 20px;
  margin-top: auto;
  margin-bottom: 30px;
  padding: 12px;
  border: 2px solid #dc3545;
  text-align: center;
  color: #dc3545;
  cursor: pointer;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.3s ease;
}

.logout:hover {
  background: #dc3545;
  color: white;
}

/* MAIN */
.main {
  flex: 1;
  margin-left: 260px;
  padding: 30px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.title {
  font-size: 28px;
  font-weight: 700;
  color: #1a1a2e;
}

.admin-info {
  display: flex;
  align-items: center;
  gap: 15px;
  background: white;
  padding: 8px 20px;
  border-radius: 30px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.admin-avatar {
  width: 40px;
  height: 40px;
  background: #006A42;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  font-size: 18px;
}

.admin-name {
  font-weight: 500;
  color: #333;
}

/* FILTER SECTION */
.filter-section {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  align-items: flex-end;
}

.filter-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.filter-group label {
  font-size: 12px;
  color: #666;
  font-weight: 500;
}

.filter-group input, .filter-group select {
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  min-width: 150px;
}

.filter-actions {
  display: flex;
  gap: 10px;
}

.btn-filter {
  background: #006A42;
  color: white;
  border: none;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
}

.btn-reset {
  background: #6c757d;
  color: white;
  border: none;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
}

/* STATS CARDS */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 30px;
}

.card-stat {
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: transform 0.2s;
}

.card-stat:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.card-stat .stat-icon {
  font-size: 32px;
  color: #006A42;
  margin-bottom: 12px;
}

.card-stat .stat-value {
  font-size: 32px;
  font-weight: 700;
  color: #1a1a2e;
}

.card-stat .stat-label {
  font-size: 14px;
  color: #666;
  margin-top: 5px;
}

/* PRINTER STATUS */
.printer-status {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 30px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.printer-status h4 {
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-bar {
  margin-bottom: 16px;
}

.status-bar-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 13px;
}

.progress-bar {
  height: 10px;
  background: #e0e0e0;
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 10px;
  transition: width 0.3s;
}

.progress-fill.paper { background: #006A42; }
.progress-fill.ink { background: #FFD700; }

.warning-text {
  color: #dc3545;
  font-size: 12px;
  margin-top: 8px;
}

/* GRID CHARTS */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card h4 {
  margin-bottom: 20px;
  color: #333;
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.loading {
  text-align: center;
  padding: 40px;
  color: #666;
}

.loading i {
  font-size: 40px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

canvas {
  max-height: 200px;
}

/* CHART COLORS */
.chart-colors {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 15px;
  justify-content: center;
}

.color-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}

.color-box {
  width: 16px;
  height: 16px;
  border-radius: 4px;
}

@media (max-width: 1024px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
  .grid {
    grid-template-columns: 1fr;
  }
  .filter-section {
    flex-direction: column;
    align-items: stretch;
  }
  .filter-group input, .filter-group select {
    width: 100%;
  }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <img src="/assets/images/logo-umy3.png" alt="UMY Logo" onerror="this.style.display='none'">
  </div>

  <div class="menu-item active" onclick="window.location.href='#'">
    <i class="bi bi-graph-up"></i> Insight
  </div>
  <div class="menu-item" onclick="window.location.href='/admin/logs.html'">
    <i class="bi bi-list-ul"></i> Log Cetak
  </div>
  <div class="menu-item" onclick="window.location.href='/admin/templates_V1.html'">
    <i class="bi bi-file-earmark-word"></i> Template V1
  </div>
  <div class="menu-item" onclick="window.location.href='/admin/templates_V2.html'">
    <i class="bi bi-grid-3x3-gap-fill"></i> Template V2
  </div>
  <div class="menu-item" onclick="window.location.href='/admin/signature.html'">
    <i class="bi bi-pen"></i> Master Signature
  </div>
  <div class="menu-item" onclick="window.location.href='/admin/maintenance.html'">
    <i class="bi bi-gear"></i> Maintenance
  </div>

  <div class="logout" id="logoutBtn">
    <i class="bi bi-box-arrow-right"></i> Logout
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="header">
    <div class="title">Dashboard Insight</div>
    <div class="admin-info">
      <div class="admin-avatar" id="adminAvatar">A</div>
      <span class="admin-name" id="adminName">Loading...</span>
    </div>
  </div>

  <!-- FILTER SECTION -->
  <div class="filter-section">
    <div class="filter-group">
      <label>Dari Tanggal</label>
      <input type="date" id="startDate">
    </div>
    <div class="filter-group">
      <label>Sampai Tanggal</label>
      <input type="date" id="endDate">
    </div>
    <div class="filter-actions">
      <button class="btn-filter" onclick="applyDateFilter()">Filter</button>
      <button class="btn-reset" onclick="resetDateFilter()">Reset</button>
    </div>
  </div>

  <!-- STATS CARDS -->
  <div class="stats">
    <div class="card-stat">
      <div class="stat-icon"><i class="bi bi-printer"></i></div>
      <div class="stat-value" id="todayPrints">-</div>
      <div class="stat-label">Cetak Hari Ini</div>
    </div>
    <div class="card-stat">
      <div class="stat-icon"><i class="bi bi-calendar-week"></i></div>
      <div class="stat-value" id="weekPrints">-</div>
      <div class="stat-label">Cetak Minggu Ini</div>
    </div>
    <div class="card-stat">
      <div class="stat-icon"><i class="bi bi-printer-fill"></i></div>
      <div class="stat-value" id="totalPrints">-</div>
      <div class="stat-label">Total Cetak</div>
    </div>
    <div class="card-stat">
      <div class="stat-icon"><i class="bi bi-people"></i></div>
      <div class="stat-value" id="totalUsers">-</div>
      <div class="stat-label">Total Pengguna</div>
    </div>
  </div>

  <!-- PRINTER STATUS -->
  <div class="printer-status">
    <h4><i class="bi bi-printer-fill"></i> Status Printer</h4>
    <div class="status-bar">
      <div class="status-bar-label">
        <span>📄 Stok Kertas</span>
        <span id="paperStockLabel">- lembar</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill paper" id="paperProgress" style="width: 0%"></div>
      </div>
      <div id="paperWarning" class="warning-text"></div>
    </div>
    <div class="status-bar">
      <div class="status-bar-label">
        <span>🖨️ Level Tinta</span>
        <span id="inkLevelLabel">- %</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill ink" id="inkProgress" style="width: 0%"></div>
      </div>
      <div id="inkWarning" class="warning-text"></div>
    </div>
  </div>

  <!-- GRID CHARTS -->
  <div class="grid">
    <!-- BAR CHART: Dokumen Terpopuler -->
    <div class="card">
      <h4><i class="bi bi-bar-chart"></i> Dokumen Terpopuler</h4>
      <canvas id="popularChart"></canvas>
      <div id="popularChartLegend" class="chart-colors"></div>
    </div>

    <!-- LINE CHART: Jam Sibuk -->
    <div class="card">
      <h4><i class="bi bi-clock-history"></i> Jam Sibuk Penggunaan</h4>
      <canvas id="hourChart"></canvas>
    </div>
  </div>
</div>

<script>
let popularChart = null;
let hourChart = null;
let currentStats = null;

// Warna untuk chart (berbeda-beda)
const chartColors = [
  '#006A42', '#FF6B35', '#4A90E2', '#F5A623', '#D0021B',
  '#8B572A', '#417505', '#9013FE', '#50E3C2', '#B8E986'
];

// ============ SESSION CHECK ============
async function checkSession() {
    try {
        const response = await fetch('/api/me');
        const data = await response.json();
        
        if (!data.success || data.user.role !== 'admin') {
            window.location.href = '/login.html';
            return null;
        }
        
        document.getElementById('adminName').innerText = data.user.name || data.user.nim;
        document.getElementById('adminAvatar').innerText = (data.user.name || data.user.nim).charAt(0).toUpperCase();
        
        return data.user;
    } catch (error) {
        window.location.href = '/login.html';
        return null;
    }
}

// ============ LOGOUT ============
async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    sessionStorage.clear();
    window.location.href = '/login.html';
}

// ============ LOAD STATISTICS WITH FILTER ============
async function loadStats(startDate, endDate) {
    try {
        let url = '/api/print-stats';
        const params = [];
        
        if (startDate) params.push(`start_date=${startDate}`);
        if (endDate) params.push(`end_date=${endDate}`);
        
        if (params.length) url += `?${params.join('&')}`;
        
        const response = await fetch(url);
        const stats = await response.json();
        currentStats = stats;
        
        document.getElementById('todayPrints').innerText = stats.today_prints || 0;
        document.getElementById('weekPrints').innerText = stats.week_prints || 0;
        document.getElementById('totalPrints').innerText = stats.total_prints || 0;
        
        // Update popular chart dengan warna berbeda
        const docNames = stats.by_document_type?.map(d => d.name) || [];
        const docCounts = stats.by_document_type?.map(d => d.count) || [];
        
        // Generate colors for each document
        const barColors = docNames.map((_, i) => chartColors[i % chartColors.length]);
        
        if (popularChart) popularChart.destroy();
        popularChart = new Chart(document.getElementById('popularChart'), {
            type: 'bar',
            data: {
                labels: docNames,
                datasets: [{
                    label: 'Jumlah Cetak',
                    data: docCounts,
                    backgroundColor: barColors,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: (ctx) => `${ctx.raw} kali cetak` } }
                }
            }
        });
        
        // Update custom legend
        const legendContainer = document.getElementById('popularChartLegend');
        if (docNames.length > 0) {
            legendContainer.innerHTML = docNames.map((name, i) => `
                <div class="color-item">
                    <div class="color-box" style="background: ${barColors[i]}"></div>
                    <span>${name}</span>
                </div>
            `).join('');
        } else {
            legendContainer.innerHTML = '<span class="text-muted">Belum ada data</span>';
        }
        
        // Update hour chart
        const hours = stats.by_hour?.map(h => `${h.hour}:00`) || [];
        const hourCounts = stats.by_hour?.map(h => h.count) || [];
        
        if (hourChart) hourChart.destroy();
        hourChart = new Chart(document.getElementById('hourChart'), {
            type: 'line',
            data: {
                labels: hours,
                datasets: [{
                    label: 'Jumlah Cetak',
                    data: hourCounts,
                    borderColor: '#006A42',
                    backgroundColor: 'rgba(0, 106, 66, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointBackgroundColor: '#006A42',
                    pointBorderColor: '#fff',
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: { callbacks: { label: (ctx) => `${ctx.raw} kali cetak` } }
                }
            }
        });
        
    } catch (error) {
        console.error('Load stats error:', error);
    }
}

// ============ APPLY DATE FILTER ============
async function applyDateFilter() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    await loadStats(startDate, endDate);
}

// ============ RESET DATE FILTER ============
async function resetDateFilter() {
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    await loadStats();
}

// ============ LOAD MAINTENANCE STATUS ============
async function loadMaintenance() {
    try {
        const response = await fetch('/api/maintenance');
        const data = await response.json();
        
        const paperStock = data.paper_stock || 0;
        const inkLevel = data.ink_level || 0;
        const paperThreshold = data.paper_threshold || 100;
        const inkThreshold = data.ink_threshold || 20;
        
        document.getElementById('paperStockLabel').innerText = `${paperStock} lembar`;
        document.getElementById('inkLevelLabel').innerText = `${inkLevel}%`;
        
        const paperPercent = Math.min(100, (paperStock / 500) * 100);
        document.getElementById('paperProgress').style.width = `${paperPercent}%`;
        document.getElementById('inkProgress').style.width = `${inkLevel}%`;
        
        if (paperStock <= paperThreshold) {
            document.getElementById('paperWarning').innerHTML = '⚠️ Stok kertas menipis! Segera isi ulang.';
        } else {
            document.getElementById('paperWarning').innerHTML = '';
        }
        
        if (inkLevel <= inkThreshold) {
            document.getElementById('inkWarning').innerHTML = '⚠️ Tinta rendah! Segera ganti cartridge.';
        } else if (inkLevel <= 30) {
            document.getElementById('inkWarning').innerHTML = '⚠️ Tinta mulai menipis, siapkan cadangan.';
        } else {
            document.getElementById('inkWarning').innerHTML = '';
        }
        
    } catch (error) {
        console.error('Load maintenance error:', error);
    }
}

// ============ LOAD TOTAL USERS ============
async function loadTotalUsers() {
    try {
        const response = await fetch('/api/users');
        const data = await response.json();
        document.getElementById('totalUsers').innerText = data.total_active_users || 0;
    } catch (error) {
        console.error('Load users error:', error);
        document.getElementById('totalUsers').innerText = '0';
    }
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', async () => {
    const admin = await checkSession();
    if (admin) {
        await loadStats();
        await loadMaintenance();
        await loadTotalUsers();
    }
    
    document.getElementById('logoutBtn').addEventListener('click', logout);
});
</script>
</body>
</html>
